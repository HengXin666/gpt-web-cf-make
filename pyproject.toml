[project]
name = "gpt-web-cf-make"
version = "0.1.0"
description = "Token保活平台 - 使用refresh_token续期access_token，附带注册机能力"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "curl_cffi>=0.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "python-multipart>=0.0.19",
    "pillow>=12.2.0",
]

[project.scripts]
gpt-web-cf-make = "py.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["py"]
